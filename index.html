<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RK GARAGE • Keuangan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{
background:linear-gradient(135deg,#12051f,#1d0633,#2d0b45);
color:#fff;padding:20px;
}
.container{max-width:1200px;margin:auto}
.title{
text-align:center;
font-size:34px;
font-weight:700;
margin-bottom:20px;
background:linear-gradient(90deg,#c084fc,#f472b6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.grid{
display:grid;
grid-template-columns:350px 1fr;
gap:20px;
}
.card{
background:#ffffff10;
backdrop-filter:blur(10px);
border:1px solid #ffffff15;
border-radius:18px;
padding:18px;
}
.card h2{margin-bottom:15px;font-size:20px}

label{
font-size:13px;
display:block;
margin:10px 0 5px;
color:#ddd;
}
input,select,textarea{
width:100%;
padding:11px;
border:none;
border-radius:10px;
background:#ffffff12;
color:#fff;
outline:none;
}
option{color:#000}
textarea{resize:none;height:80px}
button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
transition:.2s;
}
.btn{
background:linear-gradient(90deg,#9333ea,#ec4899);
color:#fff;
}
.btn:hover{transform:scale(1.02)}
.btn-discord{
background:#5865F2;
color:#fff;
}
.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:18px;
}
.box{
padding:15px;
border-radius:14px;
text-align:center;
background:#ffffff10;
}
.box h3{font-size:13px;color:#ccc}
.box p{font-size:22px;font-weight:700;margin-top:8px}
.table{
overflow:auto;
max-height:500px;
}
table{
width:100%;
border-collapse:collapse;
}
th,td{
padding:10px;
font-size:13px;
text-align:left;
border-bottom:1px solid #ffffff15;
}
th{color:#c084fc}
.badge{
padding:4px 8px;
border-radius:20px;
font-size:11px;
font-weight:700;
}
.in{background:#14532d;color:#86efac}
.out{background:#7f1d1d;color:#fca5a5}
.delete{
background:#dc2626;
padding:5px 8px;
border-radius:6px;
cursor:pointer;
font-size:11px;
}
@media(max-width:900px){
.grid{grid-template-columns:1fr}
.summary{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<div class="title">RK GARAGE • KEUANGAN</div>

<div class="grid">

<div class="card">
<h2>Tambah Transaksi</h2>

<label>Petugas</label>
<input id="petugas" placeholder="Nama Petugas">

<label>Jenis Transaksi</label>
<select id="jenis">
<option value="Pemasukan">Pemasukan</option>
<option value="Pengeluaran">Pengeluaran</option>
</select>

<label>Kategori</label>
<select id="kategori">
<option>Service</option>
<option>Modifikasi</option>
<option>Sparepart</option>
<option>Cat</option>
<option>Operasional</option>
<option>Gaji</option>
<option>Lainnya</option>
</select>

<label>Nominal (Rp)</label>
<input id="nominal" type="number" placeholder="500000">

<label>Keterangan</label>
<textarea id="keterangan" placeholder="Contoh : Service Sultan RS7"></textarea>

<button class="btn" onclick="tambah()">+ Simpan Transaksi</button>
<button class="btn-discord" onclick="kirimDiscord()">Kirim Laporan Discord</button>
</div>

<div class="card">

<div class="summary">
<div class="box">
<h3>Pemasukan</h3>
<p id="totalIn">Rp0</p>
</div>
<div class="box">
<h3>Pengeluaran</h3>
<p id="totalOut">Rp0</p>
</div>
<div class="box">
<h3>Saldo</h3>
<p id="saldo">Rp0</p>
</div>
</div>

<h2>Riwayat Transaksi</h2>

<div class="table">
<table>
<thead>
<tr>
<th>Tanggal</th>
<th>Jenis</th>
<th>Kategori</th>
<th>Nominal</th>
<th>Petugas</th>
<th></th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>
</div>
</div>

<script>
const WEBHOOK_URL="https://discord.com/api/webhooks/1532706114184020058/QBK_ct9S01OF1wWb7vyqM-wWekDvLFLCw0J1RpZMZPtiwq303uuv8_6CsQ8G5yVX7HK-";

let data=JSON.parse(localStorage.getItem("rk_keuangan"))||[];

function rupiah(n){
return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR"}).format(n);
}

function simpan(){
localStorage.setItem("rk_keuangan",JSON.stringify(data));
render();
}

function tambah(){

const petugas=document.getElementById("petugas").value||"-";
const jenis=document.getElementById("jenis").value;
const kategori=document.getElementById("kategori").value;
const nominal=parseInt(document.getElementById("nominal").value);
const ket=document.getElementById("keterangan").value||"-";

if(!nominal||nominal<=0){
alert("Masukkan nominal!");
return;
}

data.unshift({
tanggal:new Date().toLocaleString("id-ID"),
petugas,jenis,kategori,nominal,ket
});

document.getElementById("nominal").value="";
document.getElementById("keterangan").value="";

simpan();
}

function hapus(i){
if(confirm("Hapus transaksi?")){
data.splice(i,1);
simpan();
}
}

function render(){

let pemasukan=0;
let pengeluaran=0;
let html="";

data.forEach((x,i)=>{

if(x.jenis=="Pemasukan") pemasukan+=x.nominal;
else pengeluaran+=x.nominal;

html+=`
<tr>
<td>${x.tanggal}</td>
<td><span class="badge ${x.jenis=="Pemasukan"?"in":"out"}">${x.jenis}</span></td>
<td>${x.kategori}</td>
<td>${rupiah(x.nominal)}</td>
<td>${x.petugas}</td>
<td><span class="delete" onclick="hapus(${i})">Hapus</span></td>
</tr>`;
});

tbody.innerHTML=html;
totalIn.innerText=rupiah(pemasukan);
totalOut.innerText=rupiah(pengeluaran);
saldo.innerText=rupiah(pemasukan-pengeluaran);
}

async function kirimDiscord(){

if(data.length===0){
alert("Belum ada transaksi.");
return;
}

let pemasukan=0;
let pengeluaran=0;

let desc="";

data.slice(0,15).forEach(x=>{

if(x.jenis=="Pemasukan") pemasukan+=x.nominal;
else pengeluaran+=x.nominal;

desc+=`**${x.jenis}** • ${rupiah(x.nominal)}\n`;
desc+=`> ${x.kategori} | ${x.petugas}\n`;
desc+=`> ${x.ket}\n\n`;

});

const embed={
title:"💰 RK GARAGE • LAPORAN KEUANGAN",
color:0x9b59b6,
description:desc,
fields:[
{name:"📈 Total Pemasukan",value:rupiah(pemasukan),inline:true},
{name:"📉 Total Pengeluaran",value:rupiah(pengeluaran),inline:true},
{name:"💵 Saldo",value:rupiah(pemasukan-pengeluaran),inline:true},
{name:"📋 Jumlah Transaksi",value:String(data.length),inline:false}
],
footer:{
text:"RK Garage Finance System"
},
timestamp:new Date().toISOString()
};

try{

const res=await fetch(WEBHOOK_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:"RK GARAGE FINANCE",
avatar_url:"https://i.imgur.com/4M34hi2.png",
embeds:[embed]
})
});

if(res.ok) alert("Berhasil dikirim ke Discord!");
else alert("Webhook gagal!");

}catch(e){
alert("Error : "+e);
}

}

render();
</script>

</body>
</html>
