<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RK Garage Finance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif;}

body{
background:linear-gradient(135deg,#0b0515,#16092b,#25063f);
min-height:100vh;
color:white;
padding:20px;
}

.container{
max-width:1200px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:25px;
}

.header h1{
font-size:36px;
background:linear-gradient(90deg,#c084fc,#9333ea,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(10px);
padding:18px;
border-radius:18px;
border:1px solid rgba(255,255,255,.08);
}

.card h3{font-size:14px;color:#d8b4fe;}
.card h2{margin-top:8px;}

.form-box{
background:rgba(255,255,255,.05);
padding:22px;
border-radius:18px;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

input,select,textarea{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:10px;
background:#24133d;
color:white;
}

textarea{resize:none;}

button{
border:none;
padding:13px;
border-radius:10px;
font-weight:600;
cursor:pointer;
transition:.2s;
}

.btn-add{
background:linear-gradient(90deg,#9333ea,#ec4899);
color:white;
}

.btn-add:hover{transform:scale(1.03);}

.table-box{
background:rgba(255,255,255,.05);
border-radius:18px;
overflow:hidden;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#2e1065;
padding:15px;
}

td{
padding:13px;
border-bottom:1px solid rgba(255,255,255,.06);
}

.income{color:#4ade80;font-weight:600;}
.expense{color:#f87171;font-weight:600;}

.delete{
background:#dc2626;
color:white;
padding:8px 12px;
border-radius:8px;
}

@media(max-width:768px){
table{font-size:13px;}
}

</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>RK GARAGE FINANCE</h1>
<p>Pencatatan Pemasukan & Pengeluaran Bengkel</p>
</div>

<div class="cards">

<div class="card">
<h3>Total Pemasukan</h3>
<h2 id="totalIncome">Rp0</h2>
</div>

<div class="card">
<h3>Total Pengeluaran</h3>
<h2 id="totalExpense">Rp0</h2>
</div>

<div class="card">
<h3>Saldo</h3>
<h2 id="balance">Rp0</h2>
</div>

</div>

<div class="form-box">

<div class="grid">

<select id="type">
<option value="Pemasukan">Pemasukan</option>
<option value="Pengeluaran">Pengeluaran</option>
</select>

<select id="category">
<option>Service</option>
<option>Sparepart</option>
<option>Operasional</option>
<option>Gaji</option>
<option>BBM</option>
<option>Lainnya</option>
</select>

<input id="name" placeholder="Nama Pelanggan/Pegawai">

<input id="amount" type="number" placeholder="Nominal">

</div>

<div style="margin-top:15px;">
<textarea id="note" rows="3" placeholder="Keterangan"></textarea>
</div>

<div style="margin-top:15px;">
<button class="btn-add" onclick="addTransaction()">Tambah Transaksi</button>
</div>

</div>

<div class="table-box">

<table>

<thead>

<tr>
<th>Tanggal</th>
<th>Jenis</th>
<th>Kategori</th>
<th>Nama</th>
<th>Nominal</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="history"></tbody>

</table>

</div>

</div>

<script>

const webhook="https://discord.com/api/webhooks/1532706114184020058/QBK_ct9S01OF1wWb7vyqM-wWekDvLFLCw0J1RpZMZPtiwq303uuv8_6CsQ8G5yVX7HK-";

let data=JSON.parse(localStorage.getItem("garageFinance"))||[];

function rupiah(n){
return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR"}).format(n);
}

function save(){
localStorage.setItem("garageFinance",JSON.stringify(data));
render();
}

function render(){

const tbody=document.getElementById("history");
tbody.innerHTML="";

let income=0;
let expense=0;

data.forEach((item,index)=>{

if(item.type==="Pemasukan") income+=item.amount;
else expense+=item.amount;

tbody.innerHTML+=`
<tr>
<td>${item.date}</td>
<td class="${item.type==="Pemasukan"?"income":"expense"}">${item.type}</td>
<td>${item.category}</td>
<td>${item.name}</td>
<td>${rupiah(item.amount)}</td>
<td><button class="delete" onclick="removeItem(${index})">Hapus</button></td>
</tr>
`;

});

document.getElementById("totalIncome").innerText=rupiah(income);
document.getElementById("totalExpense").innerText=rupiah(expense);
document.getElementById("balance").innerText=rupiah(income-expense);

}

function removeItem(i){
data.splice(i,1);
save();
}

async function sendDiscord(item){

if(webhook==="YOUR_DISCORD_WEBHOOK") return;

const color=item.type==="Pemasukan"?5763719:15548997;

await fetch(webhook,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({

username:"RK Garage Finance",

embeds:[{

title:`💰 ${item.type} Baru`,

color:color,

fields:[
{name:"Kategori",value:item.category,inline:true},
{name:"Nama",value:item.name||"-",inline:true},
{name:"Nominal",value:rupiah(item.amount),inline:true},
{name:"Keterangan",value:item.note||"-"}
],

footer:{text:item.date}

}]

})
});

}

function addTransaction(){

const item={

type:type.value,
category:category.value,
name:name.value||"-",
amount:Number(amount.value),
note:note.value||"-",
date:new Date().toLocaleString("id-ID")

};

if(item.amount<=0){
alert("Nominal tidak valid.");
return;
}

data.unshift(item);

save();

sendDiscord(item);

name.value="";
amount.value="";
note.value="";

}

render();

</script>

</body>
</html>
