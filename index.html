<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RK Garage Finance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#3b0764 0%,transparent 35%),
        radial-gradient(circle at bottom right,#581c87 0%,transparent 30%),
        #08050d;
    color:white;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* HEADER */

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:38px;
    font-weight:700;
    background:linear-gradient(
        90deg,
        #c084fc,
        #a855f7,
        #ec4899
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.header p{
    color:#c4b5fd;
    margin-top:5px;
}

/* DASHBOARD */

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px;
    backdrop-filter:blur(10px);
}

.stat-title{
    color:#c4b5fd;
    font-size:14px;
}

.stat-value{
    font-size:25px;
    font-weight:700;
    margin-top:8px;
}

.income-text{
    color:#4ade80;
}

.expense-text{
    color:#f87171;
}

.balance-text{
    color:#c084fc;
}

/* FORM */

.form-box{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:22px;
    margin-bottom:20px;
}

.form-title{
    font-size:20px;
    font-weight:600;
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.input-group{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.input-group label{
    font-size:13px;
    color:#c4b5fd;
}

input,
select,
textarea{
    width:100%;
    border:1px solid rgba(255,255,255,.1);
    outline:none;
    border-radius:11px;
    padding:13px;
    background:#180d27;
    color:white;
    font-size:14px;
}

input:focus,
select:focus{
    border-color:#a855f7;
}

textarea{
    resize:none;
}

.full{
    grid-column:1 / -1;
}

/* BUTTON */

.button-area{
    display:flex;
    gap:10px;
    margin-top:18px;
}

button{
    border:none;
    cursor:pointer;
    border-radius:11px;
    padding:13px 18px;
    font-weight:600;
    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.btn-add{
    background:linear-gradient(
        90deg,
        #9333ea,
        #ec4899
    );
    color:white;
    flex:1;
}

.btn-recap{
    background:#312e81;
    color:white;
}

.btn-clear{
    background:#3f3f46;
    color:white;
}

/* TABLE */

.table-box{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    overflow:hidden;
}

.table-header{
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.table-header h2{
    font-size:20px;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

thead{
    background:#24113d;
}

th{
    padding:15px;
    text-align:left;
    font-size:13px;
    color:#d8b4fe;
}

td{
    padding:14px 15px;
    border-top:1px solid rgba(255,255,255,.06);
    font-size:13px;
}

.type-income{
    color:#4ade80;
    font-weight:600;
}

.type-expense{
    color:#f87171;
    font-weight:600;
}

.delete-btn{
    background:#dc2626;
    color:white;
    padding:7px 10px;
    font-size:12px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:40px;
    color:#a1a1aa;
}

/* RESPONSIVE */

@media(max-width:800px){

    body{
        padding:12px;
    }

    .header h1{
        font-size:28px;
    }

    .dashboard{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .button-area{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>RK GARAGE FINANCE</h1>

        <p>
            Pencatatan Pemasukan & Pengeluaran Bengkel
        </p>

    </div>


    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="stat">

            <div class="stat-title">
                TOTAL PEMASUKAN
            </div>

            <div
                class="stat-value income-text"
                id="totalIncome"
            >
                Rp0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                TOTAL PENGELUARAN
            </div>

            <div
                class="stat-value expense-text"
                id="totalExpense"
            >
                Rp0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                SALDO
            </div>

            <div
                class="stat-value balance-text"
                id="balance"
            >
                Rp0
            </div>

        </div>

    </div>


    <!-- FORM -->

    <div class="form-box">

        <div class="form-title">
            Tambah Transaksi
        </div>


        <div class="form-grid">

            <!-- JENIS -->

            <div class="input-group">

                <label>
                    Jenis Transaksi
                </label>

                <select id="type">

                    <option value="Pemasukan">
                        Pemasukan
                    </option>

                    <option value="Pengeluaran">
                        Pengeluaran
                    </option>

                </select>

            </div>


            <!-- NAMA -->

            <div class="input-group">

                <label>
                    Nama
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Masukkan nama"
                >

            </div>


            <!-- NOMINAL -->

            <div class="input-group">

                <label>
                    Nominal
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Contoh: 500000"
                    min="1"
                >

            </div>


            <!-- KETERANGAN -->

            <div class="input-group">

                <label>
                    Keterangan
                </label>

                <select id="note">

                    <option value="">
                        Pilih Keterangan
                    </option>

                    <option value="Restock Gold">
                        Restock Gold
                    </option>

                    <option value="Restock Makanan">
                        Restock Makanan
                    </option>

                    <option value="Restock Coklat">
                        Restock Coklat
                    </option>

                    <option value="Restock Bahan Crafting">
                        Restock Bahan Crafting
                    </option>

                    <option value="Restock Kepolisian">
                        Restock Kepolisian
                    </option>

                </select>

            </div>

        </div>


        <div class="button-area">

            <button
                class="btn-add"
                onclick="addTransaction()"
            >
                + Tambah Transaksi
            </button>

            <button
                class="btn-recap"
                onclick="sendRecap()"
            >
                📊 Kirim Rekap Discord
            </button>

            <button
                class="btn-clear"
                onclick="clearAll()"
            >
                🗑 Hapus Semua
            </button>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-box">

        <div class="table-header">

            <h2>
                Riwayat Transaksi
            </h2>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            TANGGAL
                        </th>

                        <th>
                            NAMA
                        </th>

                        <th>
                            JENIS
                        </th>

                        <th>
                            KETERANGAN
                        </th>

                        <th>
                            NOMINAL
                        </th>

                        <th>
                            AKSI
                        </th>

                    </tr>

                </thead>


                <tbody id="history">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================
   DISCORD WEBHOOK
========================================= */

const webhook =
"https://canary.discord.com/api/webhooks/1538120199776247921/HFz3RKSyLmfoFoBhbbwSal5TfklJIG7XdkKsJVoSwyympUp4_qu6AWFesE_8fj1pi0KF";


/* =========================================
   DATABASE LOCAL STORAGE
========================================= */

let data =
JSON.parse(
    localStorage.getItem("garageFinance")
) || [];


/* =========================================
   FORMAT RUPIAH
========================================= */

function rupiah(number){

    return new Intl.NumberFormat(
        "id-ID",
        {
            style:"currency",
            currency:"IDR",
            maximumFractionDigits:0
        }
    ).format(number || 0);

}


/* =========================================
   SIMPAN DATA
========================================= */

function saveData(){

    localStorage.setItem(
        "garageFinance",
        JSON.stringify(data)
    );

}


/* =========================================
   RENDER
========================================= */

function render(){

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    let income = 0;
    let expense = 0;


    if(data.length === 0){

        history.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty"
                >
                    Belum ada transaksi
                </td>

            </tr>

        `;

    }


    data.forEach((item,index)=>{

        if(item.type === "Pemasukan"){

            income += Number(item.amount);

        }else{

            expense += Number(item.amount);

        }


        history.innerHTML += `

            <tr>

                <td>
                    ${item.date}
                </td>

                <td>
                    <strong>
                        ${escapeHTML(item.name)}
                    </strong>
                </td>

                <td
                    class="${
                        item.type === "Pemasukan"
                        ? "type-income"
                        : "type-expense"
                    }"
                >
                    ${item.type}
                </td>

                <td>
                    ${item.note}
                </td>

                <td>
                    ${rupiah(item.amount)}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(${index})"
                    >
                        Hapus
                    </button>

                </td>

            </tr>

        `;

    });


    document.getElementById(
        "totalIncome"
    ).innerText = rupiah(income);


    document.getElementById(
        "totalExpense"
    ).innerText = rupiah(expense);


    document.getElementById(
        "balance"
    ).innerText = rupiah(
        income - expense
    );

}


/* =========================================
   TAMBAH TRANSAKSI
========================================= */

async function addTransaction(){

    const type =
        document.getElementById("type").value;

    const name =
        document.getElementById("name")
        .value
        .trim();

    const amount =
        Number(
            document.getElementById("amount").value
        );

    const note =
        document.getElementById("note").value;


    /* VALIDASI */

    if(!name){

        alert("Nama wajib diisi!");

        return;

    }


    if(!amount || amount <= 0){

        alert("Nominal wajib diisi!");

        return;

    }


    if(!note){

        alert("Silakan pilih keterangan!");

        return;

    }


    /* DATA */

    const transaction = {

        id:Date.now(),

        date:new Date()
            .toLocaleString("id-ID"),

        name:name,

        type:type,

        note:note,

        amount:amount

    };


    /* SIMPAN */

    data.unshift(transaction);

    saveData();

    render();


    /* KIRIM KE DISCORD */

    await sendTransactionToDiscord(
        transaction
    );


    /* RESET */

    document.getElementById(
        "name"
    ).value = "";

    document.getElementById(
        "amount"
    ).value = "";

    document.getElementById(
        "note"
    ).value = "";

}


/* =========================================
   KIRIM TRANSAKSI KE DISCORD
========================================= */

async function sendTransactionToDiscord(item){

    if(!webhook){

        console.warn("Webhook Discord belum diatur.");
        return;

    }


    const isIncome =
        item.type === "Pemasukan";


    const embed = {

        title:
            isIncome
            ? "💰 PEMASUKAN BARU"
            : "💸 PENGELUARAN BARU",

        color:
            isIncome
            ? 5763719
            : 15548997,

        fields:[

            {
                name:"👤 Nama",
                value:
                    `**${item.name}**`,
                inline:true
            },

            {
                name:"📌 Jenis",
                value:
                    item.type,
                inline:true
            },

            {
                name:"💵 Nominal",
                value:
                    `**${rupiah(item.amount)}**`,
                inline:true
            },

            {
                name:"📝 Keterangan",
                value:
                    item.note,
                inline:false
            },

            {
                name:"📅 Waktu",
                value:
                    item.date,
                inline:false
            }

        ],

        footer:{
            text:
                "RK Garage Finance"
        },

        timestamp:
            new Date().toISOString()

    };


    try{

        const response =
            await fetch(
                webhook,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                "RK Garage Finance",

                            embeds:[
                                embed
                            ]

                        })

                }
            );


        if(!response.ok){

            const errorText = await response.text();

            console.error("Discord HTTP", response.status, errorText);

            alert(
                `Data tersimpan, tetapi gagal dikirim ke Discord.\\nHTTP ${response.status}`
            );

            return false;

        }

        console.log("Transaksi berhasil dikirim ke Discord.");
        return true;

    }catch(error){

        console.error(error);

        alert(
            "Data tersimpan, tetapi Discord tidak dapat dihubungi."
        );

    }

}


/* =========================================
   KIRIM REKAP
========================================= */

async function sendRecap(){

    if(!webhook){

        alert("Masukkan Discord Webhook terlebih dahulu.");
        return;

    }


    if(data.length === 0){

        alert(
            "Belum ada transaksi."
        );

        return;

    }


    let income = 0;
    let expense = 0;

    let transactionList = "";


    data.forEach((item,index)=>{

        const amount =
            Number(item.amount) || 0;


        if(item.type === "Pemasukan"){

            income += amount;

        }else{

            expense += amount;

        }


        transactionList +=

            `**${index + 1}. ${item.name}**\n` +

            `> Jenis: ${item.type}\n` +

            `> Keterangan: ${item.note}\n` +

            `> Nominal: ${rupiah(amount)}\n` +

            `> Waktu: ${item.date}\n\n`;

    });


    const balance =
        income - expense;


    const embed = {

        title:
            "📊 REKAP KEUANGAN BENGKEL",

        color:
            10181046,

        fields:[

            {
                name:"💰 Total Pemasukan",
                value:
                    `**${rupiah(income)}**`,
                inline:true
            },

            {
                name:"💸 Total Pengeluaran",
                value:
                    `**${rupiah(expense)}**`,
                inline:true
            },

            {
                name:"💵 Saldo",
                value:
                    `**${rupiah(balance)}**`,
                inline:true
            }

        ],

        description:
            "### 📋 Daftar Transaksi\n\n" +
            transactionList,

        footer:{
            text:
                `Total ${data.length} transaksi • RK Garage Finance`
        },

        timestamp:
            new Date().toISOString()

    };


    try{

        const response =
            await fetch(
                webhook,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            username:
                                "RK Garage Finance",

                            embeds:[
                                embed
                            ]

                        })

                }
            );


        if(!response.ok){

            const errorText = await response.text();

            console.error("Discord HTTP", response.status, errorText);

            alert(
                `Gagal mengirim rekap.\\nHTTP ${response.status}`
            );

            return;

        }

        alert("Rekap berhasil dikirim ke Discord!");


    }catch(error){

        console.error(error);

        alert(
            "Terjadi kesalahan saat mengirim rekap."
        );

    }

}


/* =========================================
   HAPUS TRANSAKSI
========================================= */

function deleteTransaction(index){

    if(
        !confirm(
            "Apakah kamu yakin ingin menghapus transaksi ini?"
        )
    ){

        return;

    }


    data.splice(index,1);

    saveData();

    render();

}


/* =========================================
   HAPUS SEMUA
========================================= */

function clearAll(){

    if(data.length === 0){

        return;

    }


    if(
        !confirm(
            "Hapus SEMUA data transaksi?"
        )
    ){

        return;

    }


    data = [];

    saveData();

    render();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   LOAD
========================================= */

render();

</script>

</body>
</html>
